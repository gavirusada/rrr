name: Build Gaviru Cam Studio Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Prepare Android SDK & Licenses
      run: |
        echo "sdk.dir=$ANDROID_HOME" > GaviruCamStudio-Android/local.properties
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo "84831b9409646a332e30571b1473a623a16e64f5" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

    - name: Build APK with Gradle
      run: |
        cd GaviruCamStudio-Android
        gradle assembleDebug --stacktrace --no-daemon

    - name: Prepare Output Directory
      run: |
        mkdir -p build-output
        cp GaviruCamStudio-Android/app/build/outputs/apk/debug/app-debug.apk build-output/GaviruCamStudio-v1.3.0.apk
        cp GaviruCamStudio-Android/app/build/outputs/apk/debug/app-debug.apk build-output/GaviruCamStudio.apk
        ls -lh build-output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GaviruCamStudio-APK
        path: build-output/GaviruCamStudio-v1.3.0.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.3.0
        name: "Gaviru Cam Studio Android App v1.3.0"
        body: |
          ### 🚀 Gaviru Cam Studio Android App v1.3.0 (Canon 4000D Wi-Fi Live View & Shutter)
          - **📷 Canon 4000D Smartphone Mode Optimized**: Configured for Canon 4000D/Rebel T100 "Connect to smartphone" Wi-Fi mode.
          - **🪞 Physical Mirror & Shutter Opening**: Automatically sets `0xD1B0` (Live View Output Mode) to 3/2, lifting the mirror and opening the shutter curtains.
          - **📸 Two-Stage Mechanical Shutter Actuation**: Mimics genuine physical shutter half-press (focus lock) and full-press (actuation) with direct save to SD card (`0xD11C`).
          - **🎬 OBS Studio Instant Streaming**: 1-click Browser Source link for VDO.Ninja streaming into OBS Studio.
        draft: false
        prerelease: false
        files: |
          build-output/GaviruCamStudio-v1.3.0.apk
          build-output/GaviruCamStudio.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
