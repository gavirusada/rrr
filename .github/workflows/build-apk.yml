name: Build Gaviru Cam Studio Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Prepare Android SDK & Licenses
      run: |
        echo "sdk.dir=$ANDROID_HOME" > GaviruCamStudio-Android/local.properties
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo "84831b9409646a332e30571b1473a623a16e64f5" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

    - name: Build APK with Gradle
      run: |
        cd GaviruCamStudio-Android
        gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build_log.txt

    - name: Push Error Log on Failure
      if: failure()
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git checkout -B build-logs
        cp /tmp/build_log.txt ./last_error.log
        git add last_error.log
        git commit -m "Build error log" || true
        git push origin build-logs --force

    - name: Copy & Rename APK
      run: |
        mkdir -p build-output
        find GaviruCamStudio-Android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/GaviruCamStudio-v1.0.0.apk \;
        ls -lh build-output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GaviruCamStudio-APK
        path: build-output/GaviruCamStudio-v1.0.0.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: "Gaviru Cam Studio Android App v1.0.0"
        body: |
          ### 🚀 Gaviru Cam Studio Android App (Wi-Fi Canon Focus & 4K VDO.Ninja OBS Streaming)
          - **Pure Canon PTP/IP Wi-Fi Engine**: Connect directly to Canon Camera Wi-Fi (`192.168.1.1:15740`).
          - **Focus Controls**: Near/Far Focus stepping, Sweet Spot focus light dimming/brightening, authentic Canon double-beep audio confirmation.
          - **OBS Studio Broadcast**: Streams 4K / 1080p Ultra HD video to OBS Studio via VDO.Ninja over 4G/5G mobile data.
          - **No PC Required**: Operates completely stand-alone on Android.
        draft: false
        prerelease: false
        files: build-output/GaviruCamStudio-v1.0.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
