name: Build Gaviru Cam Studio Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK with Gradle
      run: |
        cd GaviruCamStudio-Android
        gradle assembleDebug --stacktrace --no-daemon

    - name: Copy & Rename APK
      run: |
        mkdir -p build-output
        cp GaviruCamStudio-Android/app/build/outputs/apk/debug/*.apk build-output/GaviruCamStudio-v1.0.0.apk
        ls -la build-output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GaviruCamStudio-APK
        path: build-output/*.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: "Gaviru Cam Studio Android App v1.0.0"
        body: |
          ### 🚀 Gaviru Cam Studio Android App (Wi-Fi Canon Focus & 4K VDO.Ninja OBS Streaming)
          - **Pure Canon PTP/IP Wi-Fi Engine**: Connect directly to Canon Camera Wi-Fi (`192.168.1.1:15740`).
          - **Focus Controls**: Near/Far Focus stepping, Sweet Spot focus light dimming/brightening, authentic Canon double-beep audio confirmation.
          - **OBS Studio Broadcast**: Streams 4K / 1080p Ultra HD video to OBS Studio via VDO.Ninja over 4G/5G mobile data.
          - **No PC Required**: Operates completely stand-alone on Android.
        draft: false
        prerelease: false
        files: build-output/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
